[project]
name = "decision-models-demo"
version = "0.1.0"
description = "Live demo of decision models (Jev API, served locally by Ollaya)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "typesafe-sdk==0.7.1",
    "fastapi>=0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "duckdb==1.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dm"]
